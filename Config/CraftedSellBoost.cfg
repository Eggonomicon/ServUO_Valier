# CraftedSellBoost.cfg
# ==========================================================
# Crafted-only sell price boost for small-pop shards
#
# Location:
#   Config/CraftedSellBoost.cfg
#
# Reload in-game (GM):
#   [ReloadCraftedSellBoost
#
# Notes:
# - Multipliers apply ONLY when the item is detected as player-made (Crafter is a Player, or safe crafted flags).
# - Ammo (arrows/bolts) is ignored by default to prevent easy gold printing.
# - PerItemCap is a safety cap on a single item's sell value.
# ==========================================================

CraftedSellBoost.Enabled=true
CraftedSellBoost.IgnoreAmmo=true

# Safety cap per item (0 disables cap)
CraftedSellBoost.PerItemCap=200000

# Low-quality penalty applied after multiplier
CraftedSellBoost.LowQualityPenalty=0.60

# Multipliers for crafted items
CraftedSellBoost.Weapon.Mult=4.0
CraftedSellBoost.Weapon.ExceptionalMult=12.0

CraftedSellBoost.Armor.Mult=3.5
CraftedSellBoost.Armor.ExceptionalMult=10.0

CraftedSellBoost.Clothing.Mult=3.0
CraftedSellBoost.Clothing.ExceptionalMult=6.0

CraftedSellBoost.Jewelry.Mult=3.0
CraftedSellBoost.Jewelry.ExceptionalMult=6.0
